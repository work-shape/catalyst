name: Publish public packages
# Source and lockfile arrive together from the core's release-only mirror.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Release tag and mirrored versions
        run: node scripts/release/context.mjs --public
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish four MIT packages with provenance (rerunnable)
        # Bootstrap new names with the organisation's granular write token. After trusted
        # publishers exist for all four names this secret may be absent; npm uses OIDC.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm release:publish
      - name: Public release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=()
            if [[ "$TAG" == *-rc.* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "Workshape Catalyst $TAG. Documentation: https://docs.workshape.ai/catalyst/" "${args[@]}"
          fi
